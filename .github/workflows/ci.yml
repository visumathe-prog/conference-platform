# Full CI/CD Pipeline
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'ConferencePlatform.sln'

jobs:
  # ============================================
  # Job 1: Build and Test
  # ============================================
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
    
    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore
    
    - name: Run Unit Tests
      run: dotnet test tests/UnitTests --configuration Release --no-build --filter "Category=Unit" --verbosity normal
    
    - name: Run Integration Tests
      env:
        POSTGRES_CONNECTION_STRING: Host=localhost;Database=test_db;Username=postgres;Password=test123
        REDIS_CONNECTION_STRING: localhost:6379
      run: dotnet test tests/IntegrationTests --configuration Release --no-build --filter "Category=Integration" --verbosity normal
    
    - name: Run Architecture Tests
      run: dotnet test tests/ArchitectureTests --configuration Release --no-build --verbosity normal
    
    - name: Calculate code coverage
      run: |
        dotnet tool install --global coverlet.console
        coverlet tests/UnitTests/bin/Release/net8.0/Identity.Service.UnitTests.dll --target "dotnet" --targetargs "test tests/UnitTests --no-build" --format opencover --output coverage.xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # ============================================
  # Job 2: Security Scan
  # ============================================
  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Security Code Scan
      uses: security-code-scan/security-code-scan@main
      with:
        path: src/
        output: security-report.sarif
    
    - name: Upload security report
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: security-report.sarif
    
    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'Conference Platform'
        path: '.'
        format: 'HTML'
        out: 'reports'
    
    - name: Upload dependency check report
      uses: actions/upload-artifact@v3
      with:
        name: dependency-check-report
        path: reports/

  # ============================================
  # Job 3: SonarQube Analysis
  # ============================================
  sonarqube:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
    
    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore
    
    - name: Run SonarQube Scanner
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.cs.opencover.reportsPaths=**/coverage.xml

  # ============================================
  # Job 4: Docker Build and Push
  # ============================================
  docker-build:
    runs-on: ubuntu-latest
    needs: [security-scan, sonarqube]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Identity Service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: src/Services/Identity.Service/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/identity-service:latest
          ${{ secrets.DOCKER_USERNAME }}/identity-service:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ============================================
  # Job 5: Deploy to Staging
  # ============================================
  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-build
    environment: staging
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to Kubernetes (Staging)
      run: |
        echo "Deploying to staging environment..."
        # kubectl apply -f deployment/kubernetes/staging/
    
  # ============================================
  # Job 6: Integration Tests on Staging
  # ============================================
  integration-tests-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: staging
    
    steps:
    - name: Run integration tests against staging
      run: |
        echo "Running smoke tests on staging..."
        dotnet test tests/SmokeTests --configuration Release

  # ============================================
  # Job 7: Deploy to Production
  # ============================================
  deploy-production:
    runs-on: ubuntu-latest
    needs: integration-tests-staging
    environment: production
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Manual approval required
      uses: trstringer/manual-approval@v1
      with:
        secret: ${{ secrets.GITHUB_TOKEN }}
        approvers: admin
    
    - name: Deploy to Kubernetes (Production)
      run: |
        echo "Deploying to production environment..."
        # kubectl apply -f deployment/kubernetes/production/
    
    - name: Verify deployment
      run: |
        echo "Verifying production deployment..."
        curl -f https://api.conference.com/health
