<mat-toolbar class="header-toolbar" color="primary">
  <div class="toolbar-container">
    
    <!-- LEFT SIDE: Hamburger Menu (always visible) -->
    <button 
      mat-icon-button 
      class="menu-button"
      (click)="toggleMenu()"
      aria-label="Menu">
      <mat-icon>menu</mat-icon>
    </button>
    
    <!-- Logo / Brand -->
    <div class="brand">
      <a routerLink="/" class="brand-link">
        <mat-icon class="brand-icon">event_available</mat-icon>
        <span class="brand-text">ConferenceHub</span>
      </a>
    </div>
    
    <!-- Navigation Links (Desktop) -->
    <nav class="nav-links desktop-nav">
      <a mat-button routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a mat-button routerLink="/events" routerLinkActive="active-link">
        <mat-icon>event</mat-icon>
        <span>Events</span>
      </a>
      <a mat-button routerLink="/sessions" routerLinkActive="active-link">
        <mat-icon>video_library</mat-icon>
        <span>Sessions</span>
      </a>
      <a mat-button routerLink="/speakers" routerLinkActive="active-link">
        <mat-icon>record_voice_over</mat-icon>
        <span>Speakers</span>
      </a>
    </nav>
    
    <!-- Spacer pushes right side items -->
    <span class="spacer"></span>
    
    <!-- RIGHT SIDE: User Actions -->
    <div class="user-actions">
      
      <!-- Notifications -->
      <button mat-icon-button class="notification-btn" [matBadge]="notificationCount()" matBadgeColor="warn">
        <mat-icon>notifications</mat-icon>
      </button>
      
      <!-- AI ASSISTANT BUTTON (prominent position - top right) -->
      <button 
        mat-icon-button 
        class="ai-assistant-btn"
        [class.loading]="isAiLoading()"
        (click)="openAiAssistant()"
        [disabled]="isAiLoading()"
        matTooltip="AI Assistant - Ask me anything!"
        matTooltipPosition="below">
        
        <mat-icon [class.spinning]="isAiLoading()">
          {{ isAiLoading() ? 'mic' : 'assistant' }}
        </mat-icon>
        
        <!-- Animated pulse effect when loading -->
        <div class="pulse-ring" *ngIf="isAiLoading()"></div>
      </button>
      
      <!-- User Profile Menu -->
      <button 
        mat-button 
        [matMenuTriggerFor]="userMenu"
        class="user-menu-btn">
        <mat-icon>account_circle</mat-icon>
        <span class="user-name">{{ authService.currentUser()?.firstName || 'User' }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      
      <mat-menu #userMenu="matMenu" xPosition="before">
        <button mat-menu-item routerLink="/profile">
          <mat-icon>person</mat-icon>
          <span>My Profile</span>
        </button>
        <button mat-menu-item routerLink="/settings">
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <button mat-menu-item routerLink="/my-tickets">
          <mat-icon>confirmation_number</mat-icon>
          <span>My Tickets</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()" class="logout-item">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
      
    </div>
  </div>
</mat-toolbar>

<!-- Mobile Side Navigation -->
<mat-sidenav-container class="mobile-sidenav-container" *ngIf="isMenuOpen()">
  <mat-sidenav 
    #sidenav 
    mode="over" 
    [opened]="isMenuOpen()"
    (closedStart)="isMenuOpen.set(false)"
    class="mobile-sidenav">
    
    <div class="sidenav-header">
      <h3>Menu</h3>
      <button mat-icon-button (click)="toggleMenu()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" (click)="toggleMenu()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/events" (click)="toggleMenu()">
        <mat-icon matListItemIcon>event</mat-icon>
        <span matListItemTitle>Events</span>
      </a>
      <a mat-list-item routerLink="/sessions" (click)="toggleMenu()">
        <mat-icon matListItemIcon>video_library</mat-icon>
        <span matListItemTitle>Sessions</span>
      </a>
      <a mat-list-item routerLink="/speakers" (click)="toggleMenu()">
        <mat-icon matListItemIcon>record_voice_over</mat-icon>
        <span matListItemTitle>Speakers</span>
      </a>
      <mat-divider></mat-divider>
      <a mat-list-item routerLink="/profile" (click)="toggleMenu()">
        <mat-icon matListItemIcon>person</mat-icon>
        <span matListItemTitle>Profile</span>
      </a>
      <a mat-list-item routerLink="/settings" (click)="toggleMenu()">
        <mat-icon matListItemIcon>settings</mat-icon>
        <span matListItemTitle>Settings</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  
  <mat-sidenav-content>
    <!-- Overlay content when menu is open -->
    <div class="sidenav-overlay" (click)="toggleMenu()"></div>
  </mat-sidenav-content>
</mat-sidenav-container>
