# Development with mocks (no keys required)
version: '3.8'

networks:
  conference-network:
    driver: bridge

services:
  postgres-identity:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: dev123
    ports:
      - "5432:5432"
    networks:
      - conference-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - conference-network

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - conference-network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - conference-network

  identity-service:
    build:
      context: .
      dockerfile: src/Services/Identity.Service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - POSTGRES_CONNECTION_STRING=Host=postgres-identity;Database=identity_db;Username=admin;Password=dev123
      - REDIS_CONNECTION_STRING=redis:6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET_KEY=dev_secret_key_32_chars_long_for_development_only
    ports:
      - "5001:80"
    networks:
      - conference-network
